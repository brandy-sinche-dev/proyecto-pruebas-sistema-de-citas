name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Tests + cobertura
        run: uv run pytest --cov --cov-report=html
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/htmlcov
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Tests + cobertura
        run: pnpm test -- --coverage
      - name: Build
        run: pnpm build
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integración (stack + smoke API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Levantar stack completo (build + healthchecks)
        env:
          DJANGO_TIME_ZONE: UTC
        run: docker compose up -d --build --wait
      - name: Smoke test API
        run: |
          set -e
          B=http://localhost:8000/api/v1
          echo "== health =="
          curl -fsS $B/health/
          echo
          echo "== login =="
          RESP=$(curl -fsS -X POST $B/auth/login/ \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"ClinicaAngry1"}')
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['access'])")
          echo "login OK"
          echo "== doctors =="
          curl -fsS $B/doctors/ -H "Authorization: Bearer $TOKEN" | \
            python3 -c "import sys,json;d=json.load(sys.stdin);assert isinstance(d,list) and len(d)>0, 'sin doctores'"
          echo "doctors OK"
          echo "== specialties =="
          curl -fsS $B/specialties/ -H "Authorization: Bearer $TOKEN" | \
            python3 -c "import sys,json;d=json.load(sys.stdin);assert isinstance(d,list) and len(d)>0, 'sin especialidades'"
          echo "specialties OK"
      - name: Logs ante fallo
        if: failure()
        run: docker compose logs backend

  e2e:
    name: E2E (Playwright + Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Instalar Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Levantar stack (Postgres + API + frontend)
        env:
          DJANGO_TIME_ZONE: UTC
          VITE_USE_MOCK: "false"
        run: docker compose up -d --build --wait
      - name: Humo E2E (@smoke)
        working-directory: frontend
        run: pnpm test:e2e:smoke
      - name: Regresión E2E (@regresion)
        working-directory: frontend
        run: pnpm test:e2e:regresion
      - name: Subir reporte de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7
      - name: Logs ante fallo
        if: failure()
        run: docker compose logs backend
