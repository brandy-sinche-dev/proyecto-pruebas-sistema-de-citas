name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Tests + cobertura
        run: uv run pytest --cov --cov-report=html
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/htmlcov
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Habilitar corepack
        run: corepack enable
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Tests + cobertura
        run: pnpm test -- --coverage
      - name: Build
        run: pnpm build
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integración (stack + smoke API)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Levantar stack completo (build + healthchecks)
        run: docker compose up -d --build --wait
      - name: Smoke test API
        run: |
          set -e
          echo "health: $(curl -fsS http://localhost:8000/api/v1/health/)"
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/v1/auth/login/ \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"ClinicaAngry1"}' | python -c "import sys,json;print(json.load(sys.stdin)['access'])")
          curl -fsS http://localhost:8000/api/v1/doctors/ -H "Authorization: Bearer $TOKEN" | \
            python -c "import sys,json;assert json.load(sys.stdin)['count']>0"
          curl -fsS http://localhost:8000/api/v1/specialties/ -H "Authorization: Bearer $TOKEN" | \
            python -c "import sys,json;assert json.load(sys.stdin)['count']>0"
      - name: Logs ante fallo
        if: failure()
        run: docker compose logs backend