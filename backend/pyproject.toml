[project]
name = "clinic-angry-backend"
version = "0.1.0"
description = "Sistema Web de Gestión de Citas Médicas de Clínica Angry — API REST"
readme = "pyproject.toml"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "django-cors-headers>=4.7,<5",
    "drf-spectacular>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "pytest-cov>=6,<7",
    "factory-boy>=3.3,<4",
    "ruff>=0.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
testpaths = ["apps", "tests"]
addopts = "-ra --cov=apps --cov=config --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "apps/*/tests.py"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
ignore = ["DJ008"]